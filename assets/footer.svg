<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111c30" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0" />
    </linearGradient>

    <filter id="f-glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes coreGlow {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .core-dot {
        transform-origin: 450px 24px;
        animation: coreGlow 2.5s infinite ease-in-out;
      }
    </style>
  </defs>

  <rect width="900" height="80" rx="12" fill="url(#footer-bg)" stroke="#1f2d47" stroke-width="1" />
  <line x1="100" y1="1" x2="800" y2="1" stroke="url(#glow-line)" stroke-width="1.5" filter="url(#f-glow)" />

  <!-- Center Energy Core -->
  <circle cx="450" cy="24" r="5" fill="#00ffcc" class="core-dot" filter="url(#f-glow)" />

  <!-- Footer Tagline -->
  <text x="450" y="46" text-anchor="middle" fill="#88a4c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="12" font-weight="500" letter-spacing="1.5">
    DESIGNED &amp; ENGINEERED BY <tspan fill="#00f2fe" font-weight="700">DIVYANSHU KUMAR</tspan>
  </text>
  <text x="450" y="64" text-anchor="middle" fill="#4d6582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="10" letter-spacing="1">
    B.Tech ECS • KIIT University • Bhubaneswar, India
  </text>
</svg>
