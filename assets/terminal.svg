<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <style>
      .t-bold { font-weight: 700; }
      .c-cyan { fill: #58a6ff; }
      .c-green { fill: #3fb950; }
      .c-purple { fill: #bc8cff; }
      .c-orange { fill: #f0883e; }
      .c-yellow { fill: #d29922; }
      .c-white { fill: #e6edf3; }
      .c-muted { fill: #8b949e; }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect width="880" height="320" rx="12" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Terminal Title Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 868 0 Q 880 0 880 12 L 880 38 L 0 38 Z" fill="#21262d" />
  <line x1="0" y1="38" x2="880" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56" />
  <circle cx="38" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="19" r="6" fill="#27c93f" />

  <!-- Title Center -->
  <text x="440" y="24" text-anchor="middle" fill="#8b949e" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">
    divyanshu@atomic-quark: ~/about-me (zsh)
  </text>

  <!-- Shell Command Prompt -->
  <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="14">
    <text x="24" y="68" class="c-green t-bold">divyanshu@kiit</text>
    <text x="145" y="68" class="c-muted">:</text>
    <text x="155" y="68" class="c-cyan">~</text>
    <text x="170" y="68" class="c-white">$ neofetch --engineer</text>
  </g>

  <!-- NeoFetch Logo / Brain Circuit Diagram on Left -->
  <g transform="translate(32, 95)" font-family="'Fira Code', monospace" font-size="11" fill="#58a6ff" opacity="0.9">
    <text x="0" y="20">    .---.      .---.    </text>
    <text x="0" y="36">   /     \    /     \   </text>
    <text x="0" y="52">  | () () |  | () () |  </text>
    <text x="0" y="68">   \  ^  /    \  ^  /   </text>
    <text x="0" y="84">    |||||      |||||    </text>
    <text x="0" y="100">  [ NEURAL / HARDWARE ] </text>
    <text x="0" y="116">    |===|======|===|    </text>
    <text x="0" y="132">   / BCI \    / AI  \   </text>
    <text x="0" y="148">  '-------'  '-------'  </text>
  </g>

  <!-- Terminal Info Rows on Right -->
  <g transform="translate(230, 95)" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13">
    <!-- Row 1: Header -->
    <text x="0" y="18" class="c-cyan t-bold">divyanshu</text>
    <text x="75" y="18" class="c-muted">@</text>
    <text x="85" y="18" class="c-green t-bold">kiit-university</text>
    <text x="0" y="32" class="c-muted">-----------------------------------------------------</text>

    <!-- Row 2: Degree -->
    <text x="0" y="52" class="c-yellow t-bold">Degree:</text>
    <text x="120" y="52" class="c-white">B.Tech in Electronics &amp; Computer Science (ECS)</text>

    <!-- Row 3: University -->
    <text x="0" y="74" class="c-yellow t-bold">University:</text>
    <text x="120" y="74" class="c-white">KIIT University, Bhubaneswar 🇮🇳</text>

    <!-- Row 4: Research -->
    <text x="0" y="96" class="c-yellow t-bold">Research:</text>
    <text x="120" y="96" class="c-purple">EEG-Based Speech Decoding &amp; Neural Signal Processing</text>

    <!-- Row 5: Focus -->
    <text x="0" y="118" class="c-yellow t-bold">Focus Area:</text>
    <text x="120" y="118" class="c-white">Artificial Intelligence • Deep Learning • Embedded Systems</text>

    <!-- Row 6: Bridges -->
    <text x="0" y="140" class="c-yellow t-bold">Passion:</text>
    <text x="120" y="140" class="c-orange">Connecting Software &amp; Hardware Prototypes</text>

    <!-- Row 7: Current Goal -->
    <text x="0" y="162" class="c-yellow t-bold">Goal:</text>
    <text x="120" y="162" class="c-green">Building Real-Time Brain-Computer Interface Systems</text>

    <!-- Row 8: Color Swatches -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="22" height="12" rx="2" fill="#ff5f56" />
      <rect x="28" y="0" width="22" height="12" rx="2" fill="#ffbd2e" />
      <rect x="56" y="0" width="22" height="12" rx="2" fill="#27c93f" />
      <rect x="84" y="0" width="22" height="12" rx="2" fill="#58a6ff" />
      <rect x="112" y="0" width="22" height="12" rx="2" fill="#bc8cff" />
      <rect x="140" y="0" width="22" height="12" rx="2" fill="#3fb950" />
      <rect x="168" y="0" width="22" height="12" rx="2" fill="#e6edf3" />
    </g>
  </g>
</svg>
