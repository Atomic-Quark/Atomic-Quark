<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2d47" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes waveMotion {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      @keyframes beacon {
        0%, 100% { opacity: 0.4; r: 4; }
        50% { opacity: 1; r: 6; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      .node-pulse {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .beacon-dot {
        animation: beacon 2s ease-in-out infinite;
      }
      .wave-path {
        animation: waveMotion 12s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" stroke="url(#border-glow)" stroke-width="1.5" />

  <!-- Background Grid -->
  <rect width="900" height="240" rx="16" fill="url(#cyber-grid)" />

  <!-- Decorative Circuit Traces / Angles -->
  <path d="M 0 40 L 40 0 M 900 200 L 860 240" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <path d="M 30 180 L 120 180 L 160 220 L 300 220" stroke="#1f3b60" stroke-width="1.5" fill="none" />
  <circle cx="300" cy="220" r="3" fill="#00f2fe" class="beacon-dot" />

  <path d="M 870 60 L 780 60 L 740 20 L 600 20" stroke="#1f3b60" stroke-width="1.5" fill="none" />
  <circle cx="600" cy="20" r="3" fill="#00ffcc" class="beacon-dot" />

  <!-- Glowing Radial Core in Center -->
  <circle cx="450" cy="110" r="160" fill="#00f2fe" fill-opacity="0.04" filter="url(#neon-glow)" />

  <!-- Flowing Bottom Cyber Waves -->
  <g class="wave-path" opacity="0.25">
    <path d="M -50 210 Q 150 180 350 215 T 750 200 T 1000 220 L 1000 240 L -50 240 Z" fill="url(#cyan-blue)" />
  </g>
  <g class="wave-path" opacity="0.15" style="animation-delay: -6s;">
    <path d="M -50 220 Q 200 235 450 205 T 850 225 T 1050 215 L 1050 240 L -50 240 Z" fill="#00ffcc" />
  </g>

  <!-- Top System Status Pill -->
  <g transform="translate(450, 42)">
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#111c30" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-115" cy="-1" r="4.5" fill="#00ff88" class="beacon-dot" />
    <text x="-98" y="3" fill="#88a4c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1.5">
      SYSTEM ONLINE <tspan fill="#00f2fe">::</tspan> KIIT UNIVERSITY
    </text>
  </g>

  <!-- Main Identity Header -->
  <text x="450" y="118" text-anchor="middle" fill="url(#cyan-blue)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="38" font-weight="900" letter-spacing="5" filter="url(#neon-glow)">
    DIVYANSHU KUMAR
  </text>

  <!-- Subtitle with Monospace Accent -->
  <text x="450" y="152" text-anchor="middle" fill="#d1e3ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="500" letter-spacing="2">
    AI / ML DEVELOPER <tspan fill="#00f2fe">•</tspan> ELECTRONICS &amp; COMPUTER SCIENCE
  </text>

  <!-- Technical Specializations Tagline -->
  <text x="450" y="180" text-anchor="middle" fill="#5e7b9f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="12" font-weight="400" letter-spacing="1">
    &lt;Deep Learning / Signal Processing / BCI / Full-Stack Systems&gt;
  </text>
</svg>
