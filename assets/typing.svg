<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 64" width="100%" height="100%">
  <defs>
    <linearGradient id="terminal-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* 20 seconds total cycle: 4s per phrase */
      @keyframes type1 {
        0% { clip-path: inset(0 100% 0 0); opacity: 1; }
        2% { clip-path: inset(0 100% 0 0); opacity: 1; }
        6% { clip-path: inset(0 0 0 0); opacity: 1; }
        16% { clip-path: inset(0 0 0 0); opacity: 1; }
        19% { clip-path: inset(0 100% 0 0); opacity: 1; }
        20%, 100% { clip-path: inset(0 100% 0 0); opacity: 0; }
      }

      @keyframes type2 {
        0%, 19.9% { clip-path: inset(0 100% 0 0); opacity: 0; }
        20% { clip-path: inset(0 100% 0 0); opacity: 1; }
        24% { clip-path: inset(0 0 0 0); opacity: 1; }
        36% { clip-path: inset(0 0 0 0); opacity: 1; }
        39% { clip-path: inset(0 100% 0 0); opacity: 1; }
        40%, 100% { clip-path: inset(0 100% 0 0); opacity: 0; }
      }

      @keyframes type3 {
        0%, 39.9% { clip-path: inset(0 100% 0 0); opacity: 0; }
        40% { clip-path: inset(0 100% 0 0); opacity: 1; }
        44% { clip-path: inset(0 0 0 0); opacity: 1; }
        56% { clip-path: inset(0 0 0 0); opacity: 1; }
        59% { clip-path: inset(0 100% 0 0); opacity: 1; }
        60%, 100% { clip-path: inset(0 100% 0 0); opacity: 0; }
      }

      @keyframes type4 {
        0%, 59.9% { clip-path: inset(0 100% 0 0); opacity: 0; }
        60% { clip-path: inset(0 100% 0 0); opacity: 1; }
        64% { clip-path: inset(0 0 0 0); opacity: 1; }
        76% { clip-path: inset(0 0 0 0); opacity: 1; }
        79% { clip-path: inset(0 100% 0 0); opacity: 1; }
        80%, 100% { clip-path: inset(0 100% 0 0); opacity: 0; }
      }

      @keyframes type5 {
        0%, 79.9% { clip-path: inset(0 100% 0 0); opacity: 0; }
        80% { clip-path: inset(0 100% 0 0); opacity: 1; }
        84% { clip-path: inset(0 0 0 0); opacity: 1; }
        96% { clip-path: inset(0 0 0 0); opacity: 1; }
        99% { clip-path: inset(0 100% 0 0); opacity: 1; }
        100% { clip-path: inset(0 100% 0 0); opacity: 0; }
      }

      .line-1 { animation: type1 20s infinite ease-in-out; }
      .line-2 { animation: type2 20s infinite ease-in-out; }
      .line-3 { animation: type3 20s infinite ease-in-out; }
      .line-4 { animation: type4 20s infinite ease-in-out; }
      .line-5 { animation: type5 20s infinite ease-in-out; }
      .cursor { animation: blink 0.8s infinite; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="64" rx="10" fill="url(#terminal-bg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Prompt Prefix -->
  <text x="24" y="38" fill="#58a6ff" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="700">
    divyanshu<tspan fill="#8b949e">@</tspan><tspan fill="#3fb950">kiit-btech</tspan><tspan fill="#8b949e">:~$</tspan>
  </text>

  <!-- Cycling Animated Texts -->
  <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="500">
    <text x="248" y="38" fill="#58a6ff" class="line-1">
      Electronics and Computer Science Student
    </text>
    <text x="248" y="38" fill="#3fb950" class="line-2">
      AI/ML Developer
    </text>
    <text x="248" y="38" fill="#d2a8ff" class="line-3">
      Deep Learning Enthusiast
    </text>
    <text x="248" y="38" fill="#79c0ff" class="line-4">
      Researching EEG-Based Speech Decoding
    </text>
    <text x="248" y="38" fill="#f0883e" class="line-5">
      Building Projects That Connect Software and Hardware
    </text>
  </g>

  <!-- Animated Terminal Blinking Block Cursor -->
  <rect x="736" y="24" width="9" height="18" fill="#58a6ff" class="cursor" />
</svg>
