    <!-- Animated Snake Path -->
    <path d="M 40 40 L 250 40 L 250 85 L 500 85 L 500 55 L 750 55 L 750 90 L 800 90" fill="none" stroke="url(#snake-body)" stroke-width="4.5" stroke-linecap="round" class="snake-trail" filter="url(#snake-glow)" />
