<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <linearGradient id="snake-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="snake-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>

    <filter id="snake-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes snakeCrawl {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .snake-trail {
        stroke-dasharray: 80 500;
        animation: snakeCrawl 6s linear infinite;
      }
      @keyframes headPulse {
        0%, 100% { r: 5; opacity: 0.8; }
        50% { r: 7; opacity: 1; }
      }
      .snake-head {
        animation: headPulse 1.5s infinite;
      }
    </style>
  </defs>

  <rect width="850" height="160" rx="10" fill="url(#snake-bg)" stroke="#30363d" stroke-width="1.2" />

